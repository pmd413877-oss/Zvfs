name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == 1 ? $2 : $1)}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect active Java major version." >&2
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, detected ${JAVA_MAJOR}." >&2
            exit 1
          fi
          echo "Java 17 or newer verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at: ${EXPECTED_APK}" >&2
            echo "Searching only inside app/build/outputs/apk for generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Found APK is empty: ${EXPECTED_APK}" >&2
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: File does not have .apk extension: ${EXPECTED_APK}" >&2
            exit 1
          fi

          echo "Successfully verified debug APK: ${EXPECTED_APK}"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TMP_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | sed 's/.*\///' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9_-]/-/g')
          RELEASE_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="${TMP_DIR}/${RELEASE_ASSET_NAME}"

          cp "$SRC_APK" "$DEST_APK"

          if [ ! -s "$DEST_APK" ]; then
            echo "Error: Failed to prepare release asset at ${DEST_APK}" >&2
            exit 1
          fi

          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${DEST_APK}"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty: ${ASSET_PATH}" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: \`${{ github.sha }}\`
          - **Signing**: Signed only with a temporary debug keystore
          - **Notice**: Intended strictly for testing. This is not a Google Play Store production release.

          Download the APK directly from the **Assets** section below.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "Release created successfully with tag: ${RELEASE_TAG}"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Name: ${ASSET_NAME}"

            echo "### 🚀 Debug APK Release Published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built and published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [${RELEASE_TAG}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Filename**: \`${ASSET_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📱 **Download**: You can download the APK directly from the **Assets** section of the [Release Page](${RELEASE_URL})." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed. The debug APK build and artifact upload succeeded."
            echo "Actions artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publish Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK build completed successfully, but GitHub Release publishing encountered an issue or was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📱 **Download Backup**: You can download the APK from the **Artifacts** section of this GitHub Actions workflow run under the name \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
          fi
